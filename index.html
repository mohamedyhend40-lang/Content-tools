

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Content Tools</title>
    <link rel="stylesheet" href="style.css">
</head>
<!-- صندوق إدخال البيانات -->
<div class="input-box">
    <textarea id="userInput" placeholder="اكتبي هنا البيانات أو المطلوب..."></textarea>

    <!-- زر توليد المحتوى -->
    <button onclick="generateContent()">توليد المحتوى</button>
</div>

<!-- مكان عرض النتيجة -->
<div id="output"></div>
<body>

    <h1>أدوات الذكاء الاصطناعي للمحتوى</h1>

    <div class="buttons">
        <button onclick="showTool('posts')">✍️ بوستات احترافية</button>
        <button onclick="showTool('ideas')">💡 أفكار محتوى</button>
        <button onclick="showTool('titles')">🔥 عناوين قوية</button>
        <button onclick="showTool('scripts')">🎥 سكريبتات الفيديو</button>
    </div>

    <div id="toolBox" class="box hidden">
        <h2 id="toolTitle"></h2>
        <textarea id="userInput" placeholder="اكتب طلبك هنا..."></textarea>        <div id="result"></div>
    </div>

    <script src="script.js"></script>
</body>
</html
